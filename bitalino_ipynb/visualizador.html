<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITULO__ - BITalino</title>
</head>

<body style="margin:0;background:#ffffff;color:#111;font-family:Arial,Helvetica,sans-serif">

<div class="bitalino-visualizador" style="box-sizing:border-box;max-width:990px;margin:auto;padding:10px;background:#ffffff">

<svg viewBox="0 0 990 390"
     style="display:block;width:100%;height:auto;fill:#111;background:#ffffff">

    <rect x="0" y="0" width="990" height="390" fill="#ffffff"/>

    <g class="bitalino-eje-x" font-size="14"></g>
    <g class="bitalino-eje-y" font-size="14"></g>

    <polyline class="bitalino-curva"
              fill="none"
              stroke="#1f77b4"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"/>

    <rect x="57" y="32" width="923" height="306"
          fill="none" stroke="#111"/>

    <text class="bitalino-titulo" x="495" y="24" text-anchor="middle" font-size="18">
        __TITULO__
    </text>

    <text x="495" y="378" text-anchor="middle" font-size="14">
        Tiempo (s)
    </text>

    <text transform="translate(20 185) rotate(-90)"
          text-anchor="middle" font-size="14">
        __ETIQUETA_EJE_Y__ (ADC crudo)
    </text>

</svg>

<div class="bitalino-estado"
     style="padding:8px 15px;color:#555;font-size:13px;background:#ffffff">
</div>

</div>

<!-- MATRIZ DE DATOS EMBEBIDA: pares [tiempo_s, valor_adc] -->
<script class="datos-bitalino"
        type="application/json"
        data-en-curso="false">[]</script>

<script>
(() => {

    // ========================================================
    // PARÁMETROS INICIALES
    // ========================================================

    const duracion = __DURACION__;

    // Cada salida del cuaderno tiene sus propios elementos y datos.
    const elemento = document.querySelector("script.datos-bitalino:not([data-inicializado])");
    if (!elemento) return;
    elemento.dataset.inicializado = "true";

    const contenedor = elemento.previousElementSibling;
    const estado = contenedor.querySelector(".bitalino-estado");
    const curva = contenedor.querySelector(".bitalino-curva");
    const ejeX = contenedor.querySelector(".bitalino-eje-x");
    const ejeY = contenedor.querySelector(".bitalino-eje-y");
    const titulo = contenedor.querySelector(".bitalino-titulo").textContent.trim();

    let datos = JSON.parse(elemento.textContent);
    let enCurso = elemento.dataset.enCurso === "true";
    let iniciada = datos.length > 0;

    // ========================================================
    // DIBUJAR SVG
    // ========================================================

    function dibujar() {

        let minimo = datos.length ? Infinity : 0;
        let maximo = datos.length ? -Infinity : 1023;
        for (const [, valor] of datos) {
            if (valor < minimo) minimo = valor;
            if (valor > maximo) maximo = valor;
        }

        const margen = Math.max(5, (maximo - minimo) * 0.1);

        const yMin = minimo - margen;
        const yMax = maximo + margen;

        const x = t => 57 + t / duracion * 923;
        const y = v => 338 - (v - yMin) / (yMax - yMin) * 306;

        // Curva de la señal seleccionada
        curva.setAttribute(
            "points",
            datos.map(([t, v]) =>
                `${x(t).toFixed(1)},${y(v).toFixed(1)}`
            ).join(" ")
        );

        // Eje X
        ejeX.innerHTML = Array.from({length: 6}, (_, i) => {

            const t = i * duracion / 5;
            const px = x(t);

            return `
                <line x1="${px}" y1="32"
                      x2="${px}" y2="338" stroke="#ddd"/>

                <text x="${px}" y="357"
                      text-anchor="middle">${+t.toFixed(2)}</text>
            `;

        }).join("");

        // Eje Y
        ejeY.innerHTML = Array.from({length: 6}, (_, i) => {

            const v = yMin + i * (yMax - yMin) / 5;
            const py = y(v);

            return `
                <line x1="57" y1="${py}"
                      x2="980" y2="${py}" stroke="#ddd"/>

                <text x="49" y="${py + 5}"
                      text-anchor="end">${v.toFixed(0)}</text>
            `;

        }).join("");

        // Estado
        estado.textContent =
            `Muestras registradas: ${datos.length} · ` +
            (!iniciada ? "Esperando muestras..." : enCurso ? "Capturando..." : "Finalizado");

    }

    // ========================================================
    // RECIBIR DATOS DESDE PYTHON
    // ========================================================

    function inyectar(nuevasMuestras, adquisicionActiva) {

        // Incorporar únicamente las nuevas muestras
        for (const muestra of nuevasMuestras) datos.push(muestra);
        iniciada = true;

        // El cuaderno actual no pasa el segundo argumento. En ese caso,
        // la captura termina cuando llega la última muestra prevista.
        const ultimoTiempo = datos.length ? datos[datos.length - 1][0] : 0;
        enCurso = adquisicionActiva === undefined
            ? ultimoTiempo < duracion - 1e-9
            : Boolean(adquisicionActiva);

        // Mantener la matriz embebida actualizada en el DOM
        elemento.textContent = JSON.stringify(datos);
        elemento.dataset.enCurso = String(enCurso);

        // JavaScript actualiza todo el gráfico
        dibujar();
    }

    // El cuaderno llama a una función diferente para cada tipo de señal.
    const tipo = titulo.match(/\b(ECG|EMG|EDA)\b/i)?.[1].toLowerCase();
    if (tipo) window[`${tipo}Inyectar`] = inyectar;

    // Primera visualización
    dibujar();

})();
</script>

</body>
</html>
